name: iOS build check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate bundled content
        run: python3 scripts/validate_content.py
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Build iOS Simulator target
        run: |
          xcodebuild \
            -project Aleja.xcodeproj \
            -scheme Aleja \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
